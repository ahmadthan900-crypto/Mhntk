name: Build Noon APK

on:
  workflow_dispatch:
  push:
    paths:
      - "noon_android_project.zip"
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Extract Noon project
        run: |
          unzip -q noon_android_project.zip -d extracted
          test -d extracted/noon_android_project/android

      - name: Configure Java and Kotlin
        working-directory: extracted/noon_android_project/android
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("app/build.gradle.kts")
          s = p.read_text()

          if "compileOptions" not in s:
              s = s.replace(
                  "    compileSdk = 35",
                  """    compileSdk = 35

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }"""
              )

          p.write_text(s)
          PY

      - name: Build Noon APK
        working-directory: extracted/noon_android_project/android
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Noon-Android-APK
          path: extracted/noon_android_project/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
