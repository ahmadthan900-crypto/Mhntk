name: Build Noon APK

on:
  workflow_dispatch:
  push:
    paths:
      - "noon_android_project.zip"
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Extract project
        run: unzip -q noon_android_project.zip -d extracted

      - name: Build APK
        working-directory: extracted/noon_android_project/android
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: noon-apk
          path: extracted/noon_android_project/android/app/build/outputs/apk/debug/app-debug.apk
