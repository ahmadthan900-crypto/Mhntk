
name: Build Noon APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'noon_android_project.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract Android project
        run: unzip -q noon_android_project.zip -d extracted

      - name: Build debug APK
        working-directory: extracted/noon_android_project/android
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Noon-Android-APK
          path: extracted/noon_android_project/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
